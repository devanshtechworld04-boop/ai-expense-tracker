<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Expense Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px 16px 90px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 20px; color: var(--accent); }
    .btn-icon { background: var(--card); border: 1px solid #334155; color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .summary-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .summary-label { font-size: 13px; color: var(--muted); }
    .summary-amount { font-size: 32px; font-weight: 700; margin: 6px 0; color: #fff; }
    .stats-row { display: flex; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .ai-box { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1px solid #334155; }
    .ai-box textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 10px; padding: 10px; font-size: 14px; resize: none; height: 68px; margin-bottom: 10px; }
    .btn-primary { width: 100%; background: var(--accent); color: #0f172a; font-weight: 700; border: none; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.6; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .expense-list { display: flex; flex-direction: column; gap: 10px; }
    .expense-item { background: var(--card); padding: 12px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .item-left { display: flex; flex-direction: column; gap: 3px; }
    .item-name { font-weight: 600; font-size: 15px; text-transform: capitalize; }
    .item-meta { font-size: 12px; color: var(--muted); }
    .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-size: 11px; margin-right: 6px; }
    .item-right { display: flex; align-items: center; gap: 10px; }
    .item-amount { font-weight: 700; font-size: 16px; color: #f87171; }
    .del-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #334155; }
    .modal-content h3 { margin-bottom: 10px; }
    .modal-content input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin: 10px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .status-msg { font-size: 12px; color: var(--green); margin-top: 6px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>AI Expense Tracker</h1>
    <div>
      <button class="btn-icon" onclick="exportCSV()">Export CSV</button>
      <button class="btn-icon" onclick="openSettings()">AI Key</button>
    </div>
  </header>

  <div class="summary-card">
    <div class="summary-label">Total Spending (This Month)</div>
    <div class="summary-amount" id="totalAmount">₹0</div>
    <div class="stats-row" id="categorySummary">No expenses recorded yet</div>
  </div>

  <div class="ai-box">
    <textarea id="aiInput" placeholder="Type naturally: e.g., Lunch 250, Petrol 500, Milk 60"></textarea>
    <button class="btn-primary" id="addBtn" onclick="processAIExpense()">✨ Add Expense with AI</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="section-title">
    <span>Recent Transactions</span>
    <span style="font-size:12px; color:var(--muted)" id="txCount">0 items</span>
  </div>

  <div class="expense-list" id="expenseList"></div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Gemini AI Settings</h3>
      <p style="font-size:13px; color:var(--muted);">Enter your free Google AI Studio API Key for advanced AI parsing (Optional - works offline too).</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <div class="modal-actions">
        <button class="btn-icon" style="flex:1" onclick="closeSettings()">Cancel</button>
        <button class="btn-primary" style="flex:1" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    const AD_IDS = {
      banner: 'ca-app-pub-5317235020851620/2289913450',
      interstitial: 'ca-app-pub-5317235020851620/6967525065',
      rewarded: 'ca-app-pub-5317235020851620/6584381682',
      appOpen: 'ca-app-pub-5317235020851620/1880905256'
    };

    let expenses = JSON.parse(localStorage.getItem('ai_expenses_v1') || '[]');
    let addActionCount = 0;

    async function initAdMob() {
      try {
        if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AdMob) return;
        const { AdMob } = window.Capacitor.Plugins;
        await AdMob.initialize({ requestTrackingAuthorization: false });

        await AdMob.showBanner({
          adId: AD_IDS.banner,
          adSize: 'ADAPTIVE_BANNER',
          position: 'BOTTOM_CENTER',
          margin: 0
        });

        await AdMob.prepareInterstitial({ adId: AD_IDS.interstitial });
      } catch (e) {
        console.log('AdMob skipped:', e);
      }
    }

    async function showInterstitialAd() {
      try {
        if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AdMob) return;
        const { AdMob } = window.Capacitor.Plugins;
        await AdMob.showInterstitial();
        await AdMob.prepareInterstitial({ adId: AD_IDS.interstitial });
      } catch (e) {
        console.log('Interstitial error:', e);
      }
    }

    async function showRewardedAd() {
      try {
        if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AdMob) return;
        const { AdMob } = window.Capacitor.Plugins;
        await AdMob.prepareRewardVideoAd({ adId: AD_IDS.rewarded });
        await AdMob.showRewardVideoAd();
      } catch (e) {
        console.log('Rewarded error:', e);
      }
    }

    function localSmartParse(text) {
      const parts = text.split(/,|\band\b|\n/i);
      const results = [];
      const rules = [
        { cat: 'Food', keys: ['tea', 'coffee', 'lunch', 'dinner', 'breakfast', 'biryani', 'milk', 'grocery', 'snacks', 'food', 'hotel', 'swiggy', 'zomato'] },
        { cat: 'Travel', keys: ['auto', 'bus', 'petrol', 'diesel', 'uber', 'ola', 'train', 'ticket', 'cab', 'fuel', 'parking'] },
        { cat: 'Bills', keys: ['bill', 'recharge', 'wifi', 'electricity', 'current', 'rent', 'water', 'gas', 'emi'] },
        { cat: 'Shopping', keys: ['shirt', 'shoes', 'amazon', 'flipkart', 'clothes', 'mall', 'bag', 'watch'] }
      ];

      for (let p of parts) {
        const match = p.match(/(\d+(\.\d+)?)/);
        if (match) {
          const amount = parseFloat(match[1]);
          let item = p.replace(match[0], '').replace(/rs|inr|₹|-|:/gi, '').trim() || 'Expense';
          let category = 'Other';
          const lower = item.toLowerCase();
          for (let r of rules) {
            if (r.keys.some(k => lower.includes(k))) {
              category = r.cat;
              break;
            }
          }
          results.push({ item, amount, category });
        }
      }
      return results;
    }

    async function processAIExpense() {
      const inputEl = document.getElementById('aiInput');
      const btn = document.getElementById('addBtn');
      const status = document.getElementById('statusMsg');
      const text = inputEl.value.trim();

      if (!text) return;
      btn.disabled = true;
      btn.innerText = 'Analyzing with AI...';
      status.innerText = '';

      let parsedItems = [];
      const apiKey = localStorage.getItem('gemini_api_key');

      if (apiKey) {
        try {
          const prompt = `Extract all expenses from: "${text}". Return ONLY a valid JSON array of objects with keys: "item" (string), "amount" (number), "category" (one of: Food, Travel, Bills, Shopping, Health, Other).`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });
          const data = await res.json();
          const rawJson = data.candidates[0].content.parts[0].text;
          parsedItems = JSON.parse(rawJson);
        } catch (err) {
          parsedItems = localSmartParse(text);
        }
      } else {
        parsedItems = localSmartParse(text);
      }

      if (parsedItems.length > 0) {
        const today = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        parsedItems.forEach(entry => {
          expenses.unshift({
            id: Date.now() + Math.random(),
            item: entry.item,
            amount: Number(entry.amount),
            category: entry.category || 'Other',
            date: today
          });
        });
        saveAndRender();
        inputEl.value = '';
        status.style.color = '#22c55e';
        status.innerText = `Added ${parsedItems.length} item(s) successfully!`;

        addActionCount++;
        if (addActionCount % 3 === 0) {
          showInterstitialAd();
        }
      } else {
        status.style.color = '#ef4444';
        status.innerText = 'Could not detect amount. Try e.g. "Coffee 50"';
      }

      btn.disabled = false;
      btn.innerText = '✨ Add Expense with AI';
    }

    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('ai_expenses_v1', JSON.stringify(expenses));
      renderUI();
    }

    function renderUI() {
      const listEl = document.getElementById('expenseList');
      const totalEl = document.getElementById('totalAmount');
      const catEl = document.getElementById('categorySummary');
      const countEl = document.getElementById('txCount');

      let total = 0;
      const catMap = {};

      listEl.innerHTML = '';
      expenses.forEach(e => {
        total += e.amount;
        catMap[e.category] = (catMap[e.category] || 0) + e.amount;

        const div = document.createElement('div');
        div.className = 'expense-item';
        div.innerHTML = `
          <div class="item-left">
            <span class="item-name">${e.item}</span>
            <span class="item-meta"><span class="badge">${e.category}</span>${e.date}</span>
          </div>
          <div class="item-right">
            <span class="item-amount">₹${e.amount}</span>
            <button class="del-btn" onclick="deleteExpense(${e.id})">✕</button>
          </div>
        `;
        listEl.appendChild(div);
      });

      totalEl.innerText = `₹${total.toLocaleString('en-IN')}`;
      countEl.innerText = `${expenses.length} items`;

      const topCats = Object.entries(catMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([k, v]) => `${k}: ₹${v}`)
        .join(' • ');

      catEl.innerText = topCats || 'No expenses recorded yet';
    }

    async function exportCSV() {
      if (expenses.length === 0) return alert('No data to export');
      await showRewardedAd();
      let csv = 'Date,Item,Category,Amount\n';
      expenses.forEach(e => {
        csv += `"${e.date}","${e.item}","${e.category}",${e.amount}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'AI_Expenses_Report.csv';
      a.click();
    }

    function openSettings() {
      document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', val);
      closeSettings();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderUI();
      initAdMob();
    });
  </script>
</body>
  </html>
